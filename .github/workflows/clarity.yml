name: Pull Microsoft Clarity

# Clarity's Data Export API only gives the last 1 to 3 days, so this runs every day and keeps the history in
# data/clarity.json (agreed 10 Nov 2026). It doesn't publish the page: the next update run or push does.
on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 India time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clarity
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull yesterday's Clarity numbers
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: python3 scripts/fetch_clarity.py
      - name: Save them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clarity.json
          git diff --cached --quiet || git commit -m "Clarity $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
