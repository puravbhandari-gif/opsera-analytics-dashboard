name: New content alerts

# Every morning at 09:37 India time: one Slack line in #core-marketing-team per new blog, resource page or YouTube video
# (agreed 18 Nov 2026). Blogs and resource pages come from Contentful, videos from the public YouTube feed.
# Moved from 09:30 to 09:37 on 19 Nov 2026 (Purav): GitHub skipped the on-the-hour run that morning, and drops busy on-the-hour runs.
on:
  schedule:
    - cron: "7 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-alerts

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post new content to Slack
        env:
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 -m pip install -q requests
          python3 scripts/publish_alerts.py
      - name: Privacy check
        env:
          CUSTOMER_NAMES: ${{ secrets.CUSTOMER_NAMES }}
          CUSTOMER_NAMES_PUBLIC_OK: ${{ secrets.CUSTOMER_NAMES_PUBLIC_OK }}
        run: python3 scripts/privacy_check.py
      - name: Save what was posted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publish_alerts_seen.json
          git diff --cached --quiet || git commit -m "New content alerts $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push
