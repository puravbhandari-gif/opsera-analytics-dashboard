name: Update numbers and publish

on:
  schedule:
    - cron: "30 2 * * 1"   # Every Monday 08:00 India time (02:30 UTC)
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]       # Any change on main republishes the page

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull numbers from Google
        if: github.event_name != 'push'
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          python -m pip install -q -r requirements.txt
          python scripts/fetch_data.py

      - name: Pull numbers from YouTube
        if: github.event_name != 'push'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: python scripts/fetch_youtube.py

      # Optional: if APIFY_TOKEN is missing or Apify fails, only the estimate is skipped.
      # Everything else still updates, and the page shows the last estimate with its date.
      - name: Find LinkedIn posts that link to opsera.ai (optional)
        id: posts
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/fetch_linkedin_posts.py

      - name: Estimate who sent the untagged LinkedIn visits (optional)
        if: github.event_name != 'push' && steps.posts.outcome == 'success'
        continue-on-error: true
        run: python scripts/estimate_linkedin.py

      - name: Save new numbers to main
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update numbers $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push

      # A run that started late must never put an older version online.
      - name: Only publish the newest version on main
        id: newest
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$(git rev-parse HEAD)" = "$latest" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not publishing: main has a newer version ($latest) than this run ($(git rev-parse HEAD))."
          fi

      - if: steps.newest.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.newest.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        if: steps.newest.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
