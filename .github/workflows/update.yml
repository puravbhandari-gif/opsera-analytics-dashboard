name: Update numbers and publish

on:
  # GitHub can delay or drop a scheduled run when it's busy; it dropped the 9 Nov 2026 run. So there are 2 each Monday:
  # 07:47 India time (02:17 UTC), and a backup at 10:47 (05:17 UTC) that stops at once if the first one already saved its numbers.
  schedule:
    - cron: "17 2 * * 1"
    - cron: "17 5 * * 1"
  workflow_dispatch:       # "Run workflow" button in the Actions tab
    inputs:
      slack_week:
        description: "Also post this Monday-to-Sunday week to Slack: its Sunday, e.g. 2026-11-01 (leave empty for no post)"
        required: false
        default: ""
  push:
    branches: [main]       # Any change on main republishes the page

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A scheduled run goes ahead only if today's update hasn't saved its numbers yet (the backup run, after a dropped one).
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.done.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: done
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "schedule" ] && git log --since="${today}T00:00:00Z" --format=%s | grep -qx "Update numbers ${today}"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Today's update already ran, so this backup run stops here."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  update-and-publish:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull numbers from Google
        if: github.event_name != 'push'
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          python -m pip install -q -r requirements.txt
          python scripts/fetch_data.py

      - name: Pull numbers from YouTube
        if: github.event_name != 'push'
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: python scripts/fetch_youtube.py

      # Optional: if HUBSPOT_TOKEN is missing or HubSpot fails, only HubSpot is skipped.
      - name: Pull contacts, meetings and deals from HubSpot (optional)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python scripts/fetch_hubspot.py

      # Optional: if NOTION_TOKEN is missing or Notion fails, last week's calendar markers stay.
      - name: Pull the GTM calendar from Notion (optional)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/fetch_notion.py

      # Optional: if APIFY_TOKEN is missing or Apify fails, only the estimate is skipped.
      # Everything else still updates, and the page shows the last estimate with its date.
      - name: Find LinkedIn posts that link to opsera.ai (optional)
        id: posts
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/fetch_linkedin_posts.py

      # Optional: if this fails, the LinkedIn exec tab keeps last week's post counts and their date.
      - name: Count Kumar's own posts and reposts (optional)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/count_kumar_posts.py

      - name: Estimate who sent the untagged LinkedIn visits (optional)
        if: github.event_name != 'push' && steps.posts.outcome == 'success'
        continue-on-error: true
        run: python scripts/estimate_linkedin.py

      # Optional: if this fails, the PR and media tab keeps last week's rows and everything else still updates.
      - name: Find new press and media mentions (optional)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/fetch_pr_media.py

      # Optional: visits to opsera.ai from each PR piece. If this fails, last week's numbers stay.
      - name: Count visits from press and media pieces (optional)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: python scripts/fetch_pr_ga.py

      # Optional: if Google News doesn't answer, last week's share of voice stays.
      - name: Count share of voice in Google News (optional)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/fetch_share_of_voice.py

      # Optional: if this fails, the Content tab's "Published this quarter" keeps last week's list.
      - name: List what we published this quarter (optional)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/fetch_published.py

      # Optional: if this fails, the Team metrics tab keeps last week's numbers and everything else still updates.
      - name: Work out the team metrics (optional)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/build_team_metrics.py

      # Optional: the Summary from the numbers. Claude Code adds its lines when asked; last week's lines are left out.
      - name: Write the Summary (optional)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/build_summary.py

      # Optional: if this fails, the plain-text files keep last week's numbers and everything else still updates.
      - name: Write the plain-text files for AI assistants (optional)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/build_for_claude.py

      - name: Save new numbers to main
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data for-claude
          git diff --cached --quiet || git commit -m "Update numbers $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main
          git push

      # A run that started late must never put an older version online.
      - name: Only publish the newest version on main
        id: newest
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$(git rev-parse HEAD)" = "$latest" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not publishing: main has a newer version ($latest) than this run ($(git rev-parse HEAD))."
          fi

      - if: steps.newest.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.newest.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        if: steps.newest.outputs.publish == 'true'
        uses: actions/deploy-pages@v4

      # Optional, Monday runs (or a run started with a slack_week): once the page is live, post the top numbers to #core-marketing-team.
      # If SLACK_WEBHOOK_URL is missing, or a number doesn't add up, nothing is posted and the page is unaffected.
      - name: Post the top numbers to Slack (optional)
        if: (github.event_name == 'schedule' || inputs.slack_week != '') && steps.newest.outputs.publish == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WEEK_ENDING: ${{ inputs.slack_week }}
        run: python scripts/post_slack.py
