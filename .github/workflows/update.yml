name: Update numbers and publish

on:
  schedule:
    - cron: "30 2 * * 1"   # Every Monday 08:00 India time (02:30 UTC)
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]       # Any change on main republishes the page

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull numbers from Google
        if: github.event_name != 'push'
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          python -m pip install -q -r requirements.txt
          python scripts/fetch_data.py

      - name: Save new numbers to main
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update numbers $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
