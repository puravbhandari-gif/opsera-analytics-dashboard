name: One-off Slack catch-up post

# Purav asked on 3 Nov 2026 for the 26 Oct to 1 Nov post, sent on 4 Nov once Search Console covers 1 Nov.
# Starts the normal update with slack_week set, so the numbers are refreshed first. If they don't add up, or
# Search Console still stops before 1 Nov, nothing is posted. Only runs on 4 Nov 2026; remove afterwards.
on:
  schedule:
    - cron: "30 5 4 11 *"   # 4 Nov, 11:00 India time

permissions:
  actions: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start the update with the Slack post for 26 Oct to 1 Nov 2026
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y-%m-%d)" != "2026-11-04" ]; then echo "Only for 4 Nov 2026."; exit 0; fi
          gh workflow run update.yml -R "${{ github.repository }}" --ref main -f slack_week=2026-11-01
